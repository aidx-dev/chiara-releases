name: Release

# ⚠️ Este fichero NO va en el repo privado. Cópialo al repo PÚBLICO de releases
#    (aidx-dev/aidx-releases) en la ruta .github/workflows/release.yml
#
# Qué hace:
#  1. Se dispara desde el repo privado (trigger-release.yml) o a mano.
#  2. Hace checkout del código FUENTE del repo privado en el tag/sha indicado.
#  3. Compila para macOS (Apple Silicon e Intel) y Windows en paralelo.
#  4. Firma los artefactos del updater y publica instaladores + latest.json
#     como una GitHub Release EN ESTE repo público.
#
# Canales:
#  - channel=stable   → prerelease=false → actualiza latest.json estable
#  - channel=rc       → prerelease=true  → release pre-release; NO toca latest estable
#  - channel=snapshot → prerelease=true  → idem, con versión automática dev.TIMESTAMP.RUN
#
# Secrets necesarios en el repo público:
#  - SOURCE_REPO_TOKEN                  PAT (fine-grained) con "Contents: read" sobre aidx-dev/aidx
#  - TAURI_SIGNING_PRIVATE_KEY          contenido de ~/.tauri/clinic-desktop.key
#  - TAURI_SIGNING_PRIVATE_KEY_PASSWORD contraseña de esa clave
#  - STAGING_SUPABASE_URL / STAGING_SUPABASE_ANON_KEY   proyecto de staging (canales rc y snapshot)
#  - PROD_SUPABASE_URL / PROD_SUPABASE_ANON_KEY         proyecto de producción (canal stable)
#  - CHIARA_{LLM,ASR,EMBEDDER}_{URL,API_KEY,MODEL}      proveedor remoto de IA (todos los canales).
#    Opcionales: si faltan, la app sólo usa los modelos locales. ⚠️ Temporal:
#    las API keys se compilan dentro del instalador y cualquiera puede extraerlas.
#  (GITHUB_TOKEN es automático y basta para crear la release en este repo)
#
# Qué Supabase trae cada build de fábrica (src-tauri/src/infrastructure/remote/config.rs):
# el paso "Elegir Supabase por canal" fija CHIARA_SUPABASE_URL_DEFAULT/ANON_KEY_DEFAULT
# antes de compilar; es el último recurso, así que `supabase.json`/`app_kv` en la
# instalación de una clínica lo siguen pisando sin recompilar nada.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Tag o SHA del repo privado a compilar (ej. v0.1.1 o abc1234)"
        required: true
      prerelease:
        description: "true para RC/snapshot, false para stable"
        required: false
        default: "false"
      channel:
        description: "stable | rc | snapshot"
        required: false
        default: "stable"
      snapshot_version:
        description: "Versión a usar en snapshots (ej. 0.0.0-dev.20260713153045.1234)"
        required: false
        default: ""
      release_notes_b64:
        description: "Changelog codificado en base64 desde el repo privado"
        required: false
        default: ""

jobs:
  publish:
    permissions:
      contents: write # crear la release + el tag en este repo público
    strategy:
      fail-fast: false
      matrix:
        include:
          # NO usar macos-latest: es un blanco móvil (GitHub rota la imagen y el
          # Xcode por defecto). Con Xcode 16.3+ el enlazado de `ort` rompe con
          # "ld: library 'clang_rt.osx' not found". macos-14 es Apple Silicon
          # estable y trae Xcode 16.2 instalado (lo fijamos abajo).
          - platform: macos-14 # Apple Silicon (M1/M2/M3)
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          # Intel: se compila en cruzado desde el mismo macos-14 (ARM) para
          # mantener Xcode 16.2. Los binarios de bin/macos se sustituyen por
          # los x86_64 en el paso "Binarios x86_64 (Intel)".
          - platform: macos-14
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout del código privado (tag ${{ inputs.source_ref }})
        uses: actions/checkout@v4
        with:
          repository: aidx-dev/aidx
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          lfs: false # los modelos (8 GB) no se bundlean; no hacen falta para compilar

      # Fija Xcode 16.2, que sí incluye libclang_rt.osx.a. Xcode 16.3+ reubicó esa
      # librería estática y la crate `ort` (ONNX Runtime) falla al enlazar con
      # "ld: library 'clang_rt.osx' not found". Requiere que el runner tenga esa
      # versión instalada: por eso arriba fijamos macos-14 (no macos-latest).
      - name: Seleccionar Xcode compatible (solo macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache de compilación de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri
          # El build script de `ort` graba en target/ las rutas de enlazado del
          # toolchain (clang de Xcode) y su carpeta de descarga de ONNX Runtime. Si
          # se restaura una caché creada con OTRO Xcode, cargo NO re-ejecuta el
          # build script y el enlazado apunta a un clang que ya no existe
          # ("clang_rt.osx not found"). Metemos la versión de Xcode en la clave para
          # que un cambio de Xcode invalide la caché y fuerce un build limpio.
          #
          # También metemos el canal: CHIARA_SUPABASE_URL_DEFAULT/ANON_KEY_DEFAULT
          # (ver el env del paso tauri-action) se compilan dentro del binario vía
          # `option_env!`, y una caché compartida entre canales podría reutilizar
          # el `.o` de `config.rs` de un build de `rc` para publicar `stable` con
          # la URL de staging empotrada.
          prefix-key: "v2-rust-xcode16.2-${{ inputs.channel }}"
          # Los dos jobs de macOS corren en el mismo runner (macos-14): sin el
          # target en la clave compartirían caché y uno pisaría al otro.
          key: ${{ matrix.target }}

      - name: Aplicar identidad de canal (RC/snapshot)
        # stable se queda con productName/identifier/icono/título por defecto
        # de tauri.conf.json. RC y snapshot necesitan los suyos propios para
        # poder convivir instalados a la vez que un stable en la misma
        # máquina (mismo productName/identifier ⇒ mismo .app/instalador ⇒ se
        # pisan entre sí al instalar).
        if: inputs.channel != 'stable'
        working-directory: source
        shell: bash
        run: |
          if [[ "${{ inputs.channel }}" == "snapshot" ]]; then
            PRODUCT_NAME="Chiara Clinic Snapshot"
            IDENTIFIER="com.chiaragroup.clinic.snapshot"
            ICON_DIR="icons-snapshot"
            ENDPOINT="https://github.com/aidx-dev/chiara-releases/releases/download/snapshot-channel/latest.json"
          else
            PRODUCT_NAME="Chiara Clinic RC"
            IDENTIFIER="com.chiaragroup.clinic.rc"
            ICON_DIR="icons-rc"
            # releases/latest solo sirve no-prerelease → rc.1 no detectaría rc.2.
            # rc-channel es una release fija (igual que snapshot-channel) que
            # siempre apunta al RC más reciente. RC→stable también funciona:
            # cuando exista una stable, su versión será mayor y el updater la
            # preferirá sobre rc-channel.
            ENDPOINT="https://github.com/aidx-dev/chiara-releases/releases/download/rc-channel/latest.json"
          fi

          jq --arg name "$PRODUCT_NAME" \
             --arg id "$IDENTIFIER" \
             --arg title "$PRODUCT_NAME" \
             --arg endpoint "$ENDPOINT" \
             --arg icon_dir "$ICON_DIR" \
             '.productName = $name
              | .identifier = $id
              | .app.windows[0].title = $title
              | .plugins.updater.endpoints = [$endpoint]
              | .bundle.icon = (.bundle.icon | map(sub("^icons/"; $icon_dir + "/")))' \
            src-tauri/tauri.conf.json \
            > src-tauri/tauri.conf.json.tmp && mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json

          if [[ "${{ inputs.channel }}" == "snapshot" ]]; then
            VERSION="${{ inputs.snapshot_version }}"
            jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json \
              > src-tauri/tauri.conf.json.tmp && mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
            echo "Versión aplicada: $VERSION"
          fi

          echo "CHIARA_APP_IDENTIFIER=$IDENTIFIER" >> "$GITHUB_ENV"
          echo "Identidad aplicada: $PRODUCT_NAME ($IDENTIFIER)"

      - name: Binarios x86_64 (Intel)
        # source/src-tauri/bin/macos sólo trae binarios arm64. Para Intel se
        # sustituyen por las mismas versiones en x86_64, descargadas de URLs
        # fijas y verificadas por SHA-256. Para subir de versión: cambiar la
        # URL y su hash a la vez que los binarios arm64 del repo privado.
        #  - llama.cpp b9297 (CPU; en Intel no hay Metal)
        #  - pdfium chromium/7881 (la misma que la arm64, API pdfium_7881 de pdfium-render)
        #  - ffmpeg 9.0.2 estático (martin-riedl.de)
        if: matrix.target == 'x86_64-apple-darwin'
        working-directory: source/src-tauri/bin/macos
        shell: bash
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/intel-bins"
          mkdir -p "$TMP"

          fetch() { # url fichero sha256
            curl -fsSL --retry 3 -o "$TMP/$2" "$1"
            echo "$3  $TMP/$2" | shasum -a 256 -c -
          }
          fetch "https://github.com/ggml-org/llama.cpp/releases/download/b9297/llama-b9297-bin-macos-x64.tar.gz" \
            llama.tar.gz 7f179110941b3e82a24b8274c77b5cb90a7ae60dbbfd9587ceddea3a8eacce0e
          fetch "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7881/pdfium-mac-x64.tgz" \
            pdfium.tgz 6dedf83990e0e3d6b7c93c9e7589c5a126b0ae14b7464d76120cff7a26afb18b
          fetch "https://ffmpeg.martin-riedl.de/download/macos/amd64/1789931006_9.0.2/ffmpeg.zip" \
            ffmpeg.zip 7c6b4125b191cbf773832dc51f424cf2b6bb7da43007d1e066f95909e47cacd4

          # Fuera todo lo arm64 (incluido libggml-metal, que en x64 no existe).
          rm -f llama* lib*.dylib rpc-server ffmpeg

          tar -xzf "$TMP/llama.tar.gz" -C "$TMP"
          cp -a "$TMP"/llama-b9297/. .

          # pdfium sólo existe a partir de feat/document-enriched-reports; los
          # refs anteriores no la traen y no hay nada que sustituir.
          if [[ -d pdfium ]]; then
            mkdir -p "$TMP/pdfium"
            tar -xzf "$TMP/pdfium.tgz" -C "$TMP/pdfium"
            cp "$TMP/pdfium/lib/libpdfium.dylib" pdfium/libpdfium.dylib
          fi

          unzip -q -o "$TMP/ffmpeg.zip" -d "$TMP/ffmpeg"
          cp "$TMP/ffmpeg/ffmpeg" ffmpeg
          chmod +x ffmpeg

          # Ningún Mach-O arm64 puede colarse en el instalador de Intel.
          BAD=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              ARCHS=$(lipo -archs "$f")
              if [[ "$ARCHS" != *x86_64* ]]; then
                echo "::error::$f no es x86_64 ($ARCHS)"
                BAD=1
              fi
            fi
          done < <(find . -type f -print0)
          exit $BAD

      - name: Instalar create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Instalar dependencias del frontend
        working-directory: source
        run: npm ci

      - name: Calcular tag y nombre de release
        id: release_meta
        shell: bash
        run: |
          NOTES_RAW=""
          if [[ -n "${{ inputs.release_notes_b64 }}" ]]; then
            NOTES_RAW=$(printf '%s' "${{ inputs.release_notes_b64 }}" | base64 --decode || true)
          fi

          if [[ "${{ inputs.channel }}" == "snapshot" ]]; then
            TAG="${{ inputs.snapshot_version }}"
            NAME="Chiara Clinic (snapshot) ${{ inputs.snapshot_version }}"
            BODY="Build automático desde develop. NO usar en producción."
          elif [[ "${{ inputs.channel }}" == "rc" ]]; then
            TAG="${{ inputs.source_ref }}"
            NAME="Chiara Clinic ${{ inputs.source_ref }}"
            BODY="Release candidate. Validar antes de promover a stable."
          else
            TAG="${{ inputs.source_ref }}"
            NAME="Chiara Clinic ${{ inputs.source_ref }}"
            BODY="Descarga el instalador de tu sistema abajo. La app se autoactualiza al arrancar."
          fi

          if [[ -n "$NOTES_RAW" ]]; then
            BODY="${BODY}\n\n## Changelog\n${NOTES_RAW}"
          fi

          {
            echo "tag=${TAG}"
            echo "name=${NAME}"
            echo "body<<EOF"
            printf "%b\n" "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Calcular args de compilación
        id: build_args
        shell: bash
        run: |
          ARGS="${{ matrix.args }}"
          # WiX/MSI requiere que el pre-release identifier sea numérico y ≤ 65535.
          # Las versiones snapshot (ej. 0.0.0-dev.20260713153045.1234) rompen ese
          # requisito → usamos NSIS en su lugar, que no tiene esa restricción
          # y también genera el artefacto del updater (.nsis.zip).
          if [[ "${{ inputs.channel }}" == "snapshot" && "${{ runner.os }}" == "Windows" ]]; then
            ARGS="$ARGS --bundles nsis"
          fi
          echo "args=${ARGS}" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Último recurso leído por src-tauri/src/infrastructure/remote/config.rs
          # (compile_time_default): stable → producción, rc/snapshot → staging.
          # `supabase.json`/`app_kv` en la instalación de una clínica lo pisan sin
          # recompilar nada.
          CHIARA_SUPABASE_URL_DEFAULT: ${{ inputs.channel == 'stable' && secrets.PROD_SUPABASE_URL || secrets.STAGING_SUPABASE_URL }}
          CHIARA_SUPABASE_ANON_KEY_DEFAULT: ${{ inputs.channel == 'stable' && secrets.PROD_SUPABASE_ANON_KEY || secrets.STAGING_SUPABASE_ANON_KEY }}
          # Proveedor remoto de IA para el toggle local/cloud, leído por
          # src-tauri/src/features/recording/engine/llama_cli.rs
          # (compile_time_default). Una variable exportada en la shell lo pisa.
          # ⚠️ TEMPORAL, sólo para pruebas: las API keys quedan legibles dentro
          # del instalador público. Se sustituirán por claves por clínica en Supabase.
          CHIARA_LLM_URL_DEFAULT: ${{ secrets.CHIARA_LLM_URL }}
          CHIARA_LLM_API_KEY_DEFAULT: ${{ secrets.CHIARA_LLM_API_KEY }}
          CHIARA_LLM_MODEL_DEFAULT: ${{ secrets.CHIARA_LLM_MODEL }}
          CHIARA_ASR_URL_DEFAULT: ${{ secrets.CHIARA_ASR_URL }}
          CHIARA_ASR_API_KEY_DEFAULT: ${{ secrets.CHIARA_ASR_API_KEY }}
          CHIARA_ASR_MODEL_DEFAULT: ${{ secrets.CHIARA_ASR_MODEL }}
          CHIARA_EMBEDDER_URL_DEFAULT: ${{ secrets.CHIARA_EMBEDDER_URL }}
          CHIARA_EMBEDDER_API_KEY_DEFAULT: ${{ secrets.CHIARA_EMBEDDER_API_KEY }}
          CHIARA_EMBEDDER_MODEL_DEFAULT: ${{ secrets.CHIARA_EMBEDDER_MODEL }}
        with:
          projectPath: source
          tagName: ${{ steps.release_meta.outputs.tag }}
          releaseName: ${{ steps.release_meta.outputs.name }}
          releaseBody: ${{ steps.release_meta.outputs.body }}
          releaseDraft: ${{ inputs.channel == 'stable' }}  # solo stable se revisa como borrador
          prerelease: ${{ inputs.prerelease == 'true' }}
          args: ${{ steps.build_args.outputs.args }}

  # Job independiente que se ejecuta UNA SOLA VEZ cuando todos los runners (mac + win)
  # han terminado. Copia latest.json de la release recién publicada a la release
  # fija "snapshot-channel", que actúa como endpoint estable para el updater.
  # Los builds de snapshot apuntan su updater a:
  #   https://github.com/aidx-dev/chiara-releases/releases/download/snapshot-channel/latest.json
  update-snapshot-channel:
    needs: publish
    if: ${{ inputs.channel == 'snapshot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Actualizar release snapshot-channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.snapshot_version }}"
          REPO="${{ github.repository }}"

          # Descargar latest.json de la release recién publicada
          gh release download "${VERSION}" \
            --repo "${REPO}" \
            --pattern "latest.json" \
            --output latest.json

          # SHA de main para anclar el tag snapshot-channel
          MAIN_SHA=$(gh api "repos/${REPO}/git/ref/heads/main" --jq '.object.sha')

          # Borrar release y tag existentes (se recrean frescos)
          gh release delete snapshot-channel --repo "${REPO}" --yes 2>/dev/null || true
          gh api "repos/${REPO}/git/refs/tags/snapshot-channel" -X DELETE 2>/dev/null || true

          # Crear tag snapshot-channel apuntando a main
          gh api "repos/${REPO}/git/refs" \
            -f ref="refs/tags/snapshot-channel" \
            -f sha="${MAIN_SHA}"

          # Crear release snapshot-channel con el latest.json
          gh release create snapshot-channel \
            --repo "${REPO}" \
            --title "Snapshot Channel (auto-update endpoint)" \
            --notes "Endpoint del updater para builds de develop. Se sobreescribe en cada push. Versión actual: ${VERSION}" \
            --prerelease \
            latest.json

  # Job independiente que se ejecuta UNA SOLA VEZ cuando todos los runners (mac + win)
  # han terminado. Copia latest.json de la release recién publicada a la release
  # fija "rc-channel", que actúa como endpoint estable para el updater de RCs.
  # Los builds RC apuntan su updater a:
  #   https://github.com/aidx-dev/chiara-releases/releases/download/rc-channel/latest.json
  update-rc-channel:
    needs: publish
    if: ${{ inputs.channel == 'rc' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Actualizar release rc-channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.source_ref }}"
          REPO="${{ github.repository }}"

          # Descargar latest.json de la release recién publicada
          gh release download "${VERSION}" \
            --repo "${REPO}" \
            --pattern "latest.json" \
            --output latest.json

          # SHA de main para anclar el tag rc-channel
          MAIN_SHA=$(gh api "repos/${REPO}/git/ref/heads/main" --jq '.object.sha')

          # Borrar release y tag existentes (se recrean frescos)
          gh release delete rc-channel --repo "${REPO}" --yes 2>/dev/null || true
          gh api "repos/${REPO}/git/refs/tags/rc-channel" -X DELETE 2>/dev/null || true

          # Crear tag rc-channel apuntando a main
          gh api "repos/${REPO}/git/refs" \
            -f ref="refs/tags/rc-channel" \
            -f sha="${MAIN_SHA}"

          # Crear release rc-channel con el latest.json
          gh release create rc-channel \
            --repo "${REPO}" \
            --title "RC Channel (auto-update endpoint)" \
            --notes "Endpoint del updater para release candidates. Se sobreescribe con cada RC. Versión actual: ${VERSION}" \
            --prerelease \
            latest.json
